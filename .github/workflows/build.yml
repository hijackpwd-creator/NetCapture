name: Build NetCapture rootless deb

on:
  workflow_dispatch:
    inputs:
      bundle_ids:
        description: "Comma-separated Bundle IDs (optional)"
        required: false
        default: "com.apple.locationd"
      executables:
        description: "Comma-separated executable names (optional)"
        required: false
        default: "imagent,locationd"
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: brew install ldid xz

      - name: Install Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"

      - name: Configure capture targets
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_BUNDLES: ${{ inputs.bundle_ids }}
          TARGET_EXECUTABLES: ${{ inputs.executables }}
        run: |
          python3 Scripts/configure_targets.py \
            --bundles "$TARGET_BUNDLES" \
            --executables "$TARGET_EXECUTABLES" \
            --write-config
          cat Config/targets.json
          cat NetCapture.plist

      - name: Generate checked-in defaults
        if: ${{ github.event_name != 'workflow_dispatch' }}
        run: python3 Scripts/configure_targets.py

      - name: Preflight
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f control
          test -f NetCapture.plist
          test -f Config/targets.json
          test -f Tweak/Generated/NCTargetConfig.h
          test -f "$THEOS/vendor/include/substrate.h"
          find "$THEOS/vendor/lib" -name 'libsubstrate.tbd' -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c Print Packaging/com.netcapture.daemon.plist >/dev/null
          python3 Scripts/configure_targets.py
          xcodebuild -version
          clang --version | head -n 1

      - name: Build rootless package
        run: |
          set -euxo pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes

      - name: Inspect package
        run: |
          set -euxo pipefail
          ls -lah packages
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          echo "Built: $DEB"
          rm -rf package-inspect
          mkdir -p package-inspect/control package-inspect/data
          cd package-inspect
          ar -t "../$DEB"
          ar -x "../$DEB"
          CONTROL_TAR="$(find . -maxdepth 1 -type f -name 'control.tar.*' | head -n 1)"
          DATA_TAR="$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)"
          test -n "$CONTROL_TAR"; test -n "$DATA_TAR"
          tar -xf "$CONTROL_TAR" -C control
          tar -xf "$DATA_TAR" -C data
          grep -qx 'Architecture: iphoneos-arm64' control/control
          find data -type f | sort | tee ../package-contents.txt
          find data -type f -name 'NetCapture.dylib' | grep -q .
          find data -type f -name 'NetCapture.plist' | grep -q .
          find data -type f -name 'netcaptured' | grep -q .
          find data -type f -name 'com.netcapture.daemon.plist' | grep -q .
          TWEAK="$(find data -type f -name 'NetCapture.dylib' | head -n 1)"
          DAEMON="$(find data -type f -name 'netcaptured' | head -n 1)"
          file "$TWEAK"; file "$DAEMON"
          lipo -info "$TWEAK" || true
          lipo -info "$DAEMON" || true

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: NetCapture-rootless-deb
          path: |
            packages/*.deb
            package-contents.txt
            Config/targets.json
            NetCapture.plist
            AUDIT.md
          if-no-files-found: error
          retention-days: 14
