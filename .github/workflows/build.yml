name: Build NetCapture rootless deb

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Target app bundle ID to inject into"
        required: true
        default: "com.example.NetCaptureTest"
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner info
        run: |
          uname -a
          sw_vers
          xcodebuild -version
          clang --version | head -n 1
          make --version | head -n 1 || true
          brew --version | head -n 1

      - name: Install minimal Theos dependencies
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euxo pipefail
          brew install ldid xz
          command -v ldid
          ldid -h >/dev/null 2>&1 || true

      - name: Install Theos
        run: |
          set -euxo pipefail
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"
          echo "$HOME/theos/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/.config/theos"
          echo 'THEOS_IGNORE_PARALLEL_BUILDING_NOTICE = yes' >> "$HOME/.config/theos/rc.mk"

      - name: Configure target bundle
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_BUNDLE: ${{ inputs.bundle_id }}
        run: |
          set -euxo pipefail
          python3 Scripts/set_bundle_id.py "$TARGET_BUNDLE"
          echo "Target bundle: $TARGET_BUNDLE"
          cat NetCapture.plist

      - name: Preflight
        run: |
          set -euxo pipefail
          test -f Makefile
          test -f control
          test -f NetCapture.plist
          test -f Packaging/com.netcapture.daemon.plist
          test -f "$THEOS/vendor/include/substrate.h"
          find "$THEOS/vendor/lib" -name 'libsubstrate.tbd' -print -quit | grep -q .
          /usr/libexec/PlistBuddy -c Print Packaging/com.netcapture.daemon.plist >/dev/null
          echo "THEOS=$THEOS"

      - name: Build rootless package
        run: |
          set -o pipefail
          make clean
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless messages=yes 2>&1 | tee build.log

      - name: Verify build output
        run: |
          set -euxo pipefail
          ls -lah packages
          DEB="$(find packages -maxdepth 1 -name '*.deb' -type f | head -n 1)"
          test -n "$DEB"
          test -s "$DEB"
          echo "Built package: $DEB"
          echo "Deb archive members:"
          ar -t "$DEB"

          # Verify staged Mach-O files before packaging.
          DYLIB="$(find .theos/_ -name 'NetCapture.dylib' -type f | head -n 1)"
          DAEMON="$(find .theos/_ -name 'netcaptured' -type f | head -n 1)"
          test -n "$DYLIB"
          test -n "$DAEMON"
          file "$DYLIB"
          file "$DAEMON"
          lipo -info "$DYLIB" || true
          lipo -info "$DAEMON" || true

          find .theos/_ -type f | sort | tee staged-files.txt
          grep -q 'NetCapture.dylib' staged-files.txt
          grep -q 'netcaptured' staged-files.txt
          grep -q 'com.netcapture.daemon.plist' staged-files.txt

      - name: Upload deb and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NetCapture-rootless-build
          path: |
            packages/*.deb
            build.log
            staged-files.txt
          if-no-files-found: warn
          retention-days: 14
